<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.3.min.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
    <script src="{{ url_for('static', filename='htmx-2.0.4.min.js') }}" defer></script>
    <title>{{ title }}</title>
  </head>
  <body>
    <main id="container" class="container-fluid py-3">
        <div id="dashboard" class="container-fluid px-0">
          <div id="feedback" class="mb-3" aria-live="polite">
            {% include "fragments/message.html" %}
          </div>
          <div id="content"
              hx-get="/list/events"
              hx-trigger="load"
              hx-target="#content"
              hx-swap="innerHTML">
          </div>
        </div>
    </main>
  </body>
</html>
