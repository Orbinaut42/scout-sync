<section id="eventEditor" aria-labelledby="eventEditorTitle">
  <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
    <h1 id="eventEditorTitle" class="h2 mb-0">Spiele bearbeiten</h1>
    <button type="button"
            class="btn btn-outline-secondary"
            hx-get="/list/hx/events"
            hx-target="#content"
            hx-swap="innerHTML">Abbrechen</button>
  </div>

  <form id="eventForm"
        method="post"
        action="/list/hx/edit"
        hx-post="/list/hx/edit"
        hx-target="#content"
        hx-swap="innerHTML">
    <div class="table-responsive">
      <table id="editTable" class="table table-sm table-striped align-middle">
        <thead class="table-light">
          <tr>
            <th id="editDateTimeColumn" scope="col">Datum</th>
            <th id="editLocationColumn" scope="col">Halle</th>
            <th id="editLeagueColumn" scope="col">Liga</th>
            <th id="editOpponentColumn" scope="col">Gegner</th>
            <th id="editScouterColumn" scope="col">Scouter</th>
            <th id="deleteButtonColumn" scope="col"><span class="visually-hidden">Aktionen</span></th>
          </tr>
        </thead>
        <tbody id="editEventTable">
          {% for event in events %}
            {% include "fragments/event_row.html" %}
          {% endfor %}
        </tbody>
      </table>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
      <button id="addRowButton"
              type="button"
              class="btn btn-outline-primary"
              hx-get="/list/hx/edit/row"
              hx-target="#editEventTable"
              hx-swap="beforeend">Spiel hinzufügen</button>
    </div>

    <div id="editorActions" class="row g-2 align-items-end mt-3">
      <div class="col-12 col-md-5 col-lg-4">
        <label for="pwInput" class="form-label">Passwort</label>
        <input id="pwInput"
               name="password"
               class="form-control"
               type="password"
               autocomplete="current-password"
               required>
      </div>
      <div class="col-12 col-md-auto d-flex flex-wrap gap-2">
        <button id="submitEvents" type="submit" class="btn btn-primary">Übernehmen</button>
        <button type="button"
                class="btn btn-outline-secondary"
                hx-get="/list/hx/events"
                hx-target="#content"
                hx-swap="innerHTML">Abbrechen</button>
      </div>
    </div>
    <div id="editorFeedback" class="mt-3" role="alert" aria-live="polite"></div>
  </form>
</section>
